<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; }
  .orb  { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .orb2 { animation-duration: 18s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(-30px, -10px) scale(1); } to { transform: translate(40px, 14px) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.spin { animation: spin 12s linear infinite; transform-origin: 120px 125px; } @keyframes spin { to { transform: rotate(360deg); } }</style>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity=".45"/>
  </linearGradient>
  <radialGradient id="gViolet"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="gCyan"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="838" height="248" rx="18"/></clipPath>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <clipPath id="av"><circle cx="120" cy="125" r="64"/></clipPath>
</defs>
<rect x="1" y="1" width="838" height="248" rx="18" fill="#0b1018"/>

  <g clip-path="url(#clip)">
    <circle class="orb" cx="689" cy="38" r="138" fill="url(#gViolet)"/>
    <circle class="orb orb2" cx="101" cy="238" r="125" fill="url(#gCyan)"/>
  </g>
<rect x="1" y="1" width="838" height="248" rx="18" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <circle cx="120" cy="125" r="71" fill="none" stroke="url(#ring)" stroke-width="2.5" class="spin"/>
  <circle cx="120" cy="125" r="64" fill="#0f1622"/>
  <text x="120" y="138" text-anchor="middle" class="sans" font-size="38" font-weight="800" fill="url(#ring)">BH</text>
  <image href="data:image/jpeg;base64," x="56" y="61" width="128" height="128" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/><!--AVATAR-->
  <circle cx="166" cy="171" r="9" fill="#4ade80" stroke="#0b1018" stroke-width="4"/>
  <text x="220" y="78" class="mono" font-size="14" fill="#38bdf8">@begumhandan</text>
  <text x="218" y="124" class="sans" font-size="40" font-weight="800" fill="#e6edf3" letter-spacing="-.5">Begüm Handan Demir</text>
  <text x="220" y="152" class="sans" font-size="15" fill="#8b98a9">Yazılım Mühendisliği · Samsun Üniversitesi · 4. sınıf</text>
  <rect x="220" y="170" width="157" height="26" rx="13.0" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".45"/><text x="298.5" y="185" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6edf3">AI &amp; LLM Güvenliği</text><rect x="387" y="170" width="98" height="26" rx="13.0" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".45"/><text x="436.0" y="185" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6edf3">Full-Stack</text><rect x="495" y="170" width="61" height="26" rx="13.0" fill="#f472b6" fill-opacity=".08" stroke="#f472b6" stroke-opacity=".45"/><text x="525.5" y="185" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6edf3">Mobil</text><rect x="566" y="170" width="143" height="26" rx="13.0" fill="#4ade80" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".45"/><text x="637.5" y="185" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#e6edf3">Otonom Sistemler</text>

</svg>
