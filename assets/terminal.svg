<svg xmlns="http://www.w3.org/2000/svg" width="840" height="324" viewBox="0 0 840 324" role="img">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; }
  .orb  { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .orb2 { animation-duration: 18s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(-30px, -10px) scale(1); } to { transform: translate(40px, 14px) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.ln { opacity: 0; animation: show .35s ease-out forwards; }@keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }.cursor { animation: show .3s forwards, blink 1.1s steps(1) infinite; }@keyframes blink { 50% { fill-opacity: 0; } }@media (prefers-reduced-motion: reduce) { .ln { opacity: 1; } }.l0 { animation-delay: 0.85s; }.l1 { animation-delay: 1.10s; }.l2 { animation-delay: 1.65s; }.l3 { animation-delay: 1.90s; }.l4 { animation-delay: 2.45s; }.l5 { animation-delay: 2.70s; }.l6 { animation-delay: 3.25s; }.l7 { animation-delay: 3.50s; }.l8 { animation-delay: 3.90s; }</style>
