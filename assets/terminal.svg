  <radialGradient id="gCyan"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="838" height="322" rx="18"/></clipPath>
  
</defs>
<rect x="1" y="1" width="838" height="322" rx="18" fill="#0b1018"/>

  <g clip-path="url(#clip)">
    <circle class="orb" cx="689" cy="49" r="178" fill="url(#gViolet)"/>
    <circle class="orb orb2" cx="101" cy="308" r="162" fill="url(#gCyan)"/>
  </g>
<rect x="1" y="1" width="838" height="322" rx="18" fill="none" stroke="url(#border)" stroke-width="1.5"/>

