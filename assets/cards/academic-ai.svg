<svg xmlns="http://www.w3.org/2000/svg" width="412" height="196" viewBox="0 0 412 196" role="img">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; }
  .orb  { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .orb2 { animation-duration: 18s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(-30px, -10px) scale(1); } to { transform: translate(40px, 14px) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity=".45"/>
  </linearGradient>
  <radialGradient id="gViolet"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="gCyan"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect x="1" y="1" width="410" height="194" rx="16"/></clipPath>
  <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="410" height="194" rx="16" fill="#0b1018"/>

<g clip-path="url(#clip)"><circle class="orb" cx="372" cy="20" r="120" fill="url(#glow)"/></g>
<rect x="1" y="1" width="410" height="194" rx="16" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <circle cx="26" cy="27" r="4" fill="#38bdf8"/>
  <text x="38" y="31" class="mono" font-size="12" fill="#8b98a9">Academic-AI-Suite</text>
  <text x="390" y="31" text-anchor="end" class="mono" font-size="15" fill="#8b98a9">↗</text>
  <text x="22" y="60" class="sans" font-size="20" font-weight="700" fill="#e6edf3">Academic AI Suite</text>
  <text x="22" y="86" class="sans" font-size="13.5" fill="#b7c3d1">Akademik yazımı yöneten AI editör: çeviri,</text><text x="22" y="107" class="sans" font-size="13.5" fill="#b7c3d1">özetleme, kaynakça ve üslup kontrolü.</text>
  <rect x="22" y="128" width="54" height="25" rx="12.5" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".45"/><text x="49.0" y="142" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#e6edf3">React</text><rect x="84" y="128" width="88" height="25" rx="12.5" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".45"/><text x="128.0" y="142" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#e6edf3">TypeScript</text><rect x="180" y="128" width="60" height="25" rx="12.5" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".45"/><text x="210.0" y="142" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#e6edf3">Gemini</text>
  <line x1="22" y1="168" x2="390" y2="168" stroke="#1f2a3a"/>
  <text x="22" y="186" class="mono" font-size="11.5" fill="#38bdf8">● <tspan fill="#8b98a9">prototip</tspan></text>

</svg>
