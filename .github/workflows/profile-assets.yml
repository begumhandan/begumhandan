name: Profil görsellerini güncelle

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 06:17 (TR)
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]
    paths: ["scripts/build_svgs.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Avatarı indirip hero.svg içine göm (GitHub, SVG içinden dış resim yüklemiyor)
      - name: Hero'ya avatar göm
        run: |
          curl -sL "https://avatars.githubusercontent.com/u/170364048?s=256" -o /tmp/avatar.png
          python3 scripts/build_svgs.py --avatar /tmp/avatar.png
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: profil görsellerini güncelle"
            git push
          fi

      # 2) Katkı grafiğini yiyen yılan (profil paletine uygun renkler)
      - name: Yılan animasyonu üret
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#1e3a5f,#2563eb,#7c3aed,#a78bfa
            dist/snake-light.svg?color_snake=#7c3aed&color_dots=#ebedf0,#c7d2fe,#818cf8,#6366f1,#4338ca

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
